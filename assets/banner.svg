<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(129, 140, 248, 0.15)"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.04); }
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes radarBeam {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatShield {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes borderShift {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 600; }
      }
      .animated-pulse {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-flow {
        stroke-dasharray: 8, 8;
        animation: flowDash 12s linear infinite;
      }
      .animated-flow-fast {
        stroke-dasharray: 6, 6;
        animation: flowDash 6s linear infinite;
      }
      .animated-float {
        animation: floatShield 5s ease-in-out infinite;
      }
      .radar-sweep {
        animation: radarBeam 10s linear infinite;
        transform-origin: 1040px 180px;
      }
      .border-pulse {
        stroke-dasharray: 300, 300;
        animation: borderShift 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Cyber Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#cyber-grid)"/>

  <!-- Dynamic Cyber Background Elements -->
  <!-- Ambient background glow blobs -->
  <circle cx="1040" cy="180" r="160" fill="rgba(56, 189, 248, 0.08)" filter="url(#glow-cyan)" class="animated-pulse"/>
  <circle cx="160" cy="100" r="130" fill="rgba(168, 85, 247, 0.06)" filter="url(#glow-cyan)" class="animated-pulse"/>

  <!-- Radar Scanner Effect on Right Side -->
  <g opacity="0.6">
    <circle cx="1040" cy="180" r="130" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1"/>
    <circle cx="1040" cy="180" r="90" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1"/>
    <circle cx="1040" cy="180" r="50" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
    <circle cx="1040" cy="180" r="6" fill="#38bdf8"/>
    <line x1="910" y1="180" x2="1170" y2="180" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1"/>
    <line x1="1040" y1="50" x2="1040" y2="310" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1"/>
    <line x1="1040" y1="180" x2="1165" y2="140" stroke="#38bdf8" stroke-width="2" class="radar-sweep" opacity="0.7"/>
  </g>

  <!-- Animated Supply Chain Pipeline Flow in Background -->
  <g opacity="0.45">
    <path d="M 80 340 C 350 340, 450 375, 750 350 C 950 335, 1020 300, 1140 260" 
          fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" class="animated-flow"/>
    <path d="M 120 70 C 320 110, 500 50, 780 75 C 920 90, 1000 130, 1120 140" 
          fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="2" class="animated-flow-fast"/>
  </g>

  <!-- Right Visual Motif: Shield with Chain & Lock (Interactive floating graphic) -->
  <g class="animated-float">
    <!-- Big Security Shield Outline -->
    <path d="M 1040 100 L 1115 135 C 1115 200, 1075 245, 1040 260 C 1005 245, 965 200, 965 135 Z" 
          fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="2.5" opacity="0.85" filter="url(#glow-subtle)"/>
    <!-- Chain Links inside Shield -->
    <circle cx="1040" cy="165" r="18" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <circle cx="1040" cy="195" r="18" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
    <path d="M 1032 175 L 1032 185 M 1048 175 L 1048 185" stroke="#ffffff" stroke-width="3"/>
    <!-- Lock Shackle Checkmark -->
    <path d="M 1028 178 L 1037 187 L 1054 168" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Border Frame with Animated Border Highlight -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="2" class="border-pulse"/>

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Tag -->
  <g transform="translate(80, 68)">
    <rect width="250" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#38bdf8" class="animated-pulse"/>
    <text x="32" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DEVSECOPS &amp; CYBERSECURITY</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="152" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Awesome Supply Chain Security
  </text>

  <!-- Subtitle -->
  <text x="80" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="400">
    Curated Hub for Software Composition Analysis (SCA), SBOM Governance, and Pipeline Integrity
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(80, 235)">
    <!-- Pill 1: SBOM -->
    <g transform="translate(0, 0)">
      <rect width="200" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
      <text x="18" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">📜 CycloneDX &amp; SPDX SBOM</text>
    </g>

    <!-- Pill 2: Malicious Packages -->
    <g transform="translate(212, 0)">
      <rect width="235" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2"/>
      <text x="18" y="24" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🛡️ Malicious Package Blocker</text>
    </g>

    <!-- Pill 3: SLSA & Provenance -->
    <g transform="translate(459, 0)">
      <rect width="215" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 197, 94, 0.35)" stroke-width="1.2"/>
      <text x="18" y="24" fill="#4ade80" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🔒 SLSA &amp; SSDF Provenance</text>
    </g>

    <!-- Pill 4: OpenSSF & Reachability -->
    <g transform="translate(686, 0)">
      <rect width="195" height="38" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.2"/>
      <text x="18" y="24" fill="#fb7185" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⚡ Reachability &amp; Attest</text>
    </g>
  </g>

  <!-- Bottom Metric / Status Strip -->
  <g transform="translate(80, 310)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <text x="0" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="500">COVERAGE:</text>
    <text x="85" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">SaaS Giants</text>
    <circle cx="170" cy="28" r="2.5" fill="#475569"/>
    
    <text x="185" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Open-Source Core Tools</text>
    <circle cx="360" cy="28" r="2.5" fill="#475569"/>

    <text x="375" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">NIST SSDF &amp; EU CRA Ready</text>
    <circle cx="585" cy="28" r="2.5" fill="#475569"/>

    <text x="600" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Continuous 2026 Updates</text>
  </g>
</svg>
